services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: customer-intelligence-db
    environment:
      POSTGRES_DB: customer_intelligence
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d customer_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: